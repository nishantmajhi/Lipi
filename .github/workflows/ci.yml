name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The suite reads the registry and the Windows font folders.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The same 98 checks as tests\run.ps1, compiled by Maven at release 21.
      - run: mvn -B --no-transfer-progress test
